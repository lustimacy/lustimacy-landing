<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0E0A14">
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=20261027f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css?v=20261027k">
    <link rel="stylesheet" href="/css/auth.css?v=20261027k">
    <title>Signing you in — Lustimacy</title>
</head>
<body class="auth-body">
    <main class="auth" id="authCallback">
        <a href="/" class="auth__brand" aria-label="Lustimacy home">
            <img src="/assets/favicon.svg?v=20261027f" width="44" height="44" alt="">
            <span>Lustimacy</span>
        </a>

        <div data-callback-status>
            <div class="auth__spinner" aria-hidden="true"></div>
            <h1 class="auth__title">Signing you in…</h1>
            <p class="auth__lede">One moment.</p>
        </div>

        <div data-callback-error hidden>
            <h1 class="auth__title">That link did not work</h1>
            <p class="auth__lede" data-callback-message></p>
            <a href="/login" class="btn btn--primary auth__submit">Send me a new link</a>
            <p class="auth__legal" data-callback-detail hidden style="word-break:break-word;"></p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js?v=20261027k" defer></script>
</body>
</html>
